# Local-development copy of cdcf-infra's auth/nginx/zitadel.conf.
#
# ⚠ This is a SECOND COPY of a file whose comments carry real reasoning. The
# routing half must otherwise stay in step with the original at:
#   https://github.com/CatholicOS/cdcf-infra/blob/main/auth/nginx/zitadel.conf
#
# Four deliberate divergences from that original, all explained below: the
# Content-Security-Policy; $zitadel_host (a normalized $http_host) in place of
# $host on the Host / X-Forwarded-Host headers; the map{} block that
# normalization depends on; and X-Forwarded-Proto, which is `https` upstream
# (production terminates TLS in front of it) and `http` here. Production is
# invisible to the header-related divergences: it runs on a default port
# (where $host and $http_host agree) and behind a real domain with no
# 127.0.0.1/[::1] loopback alias to confuse with it. This stack has both
# problems, since ${ZITADEL_PORT} is routinely non-default and every
# published port binds 127.0.0.1 specifically.
#
# Why the CSP differs: production's connect-src allowlists the CDCF and LitCal
# origins. It does not include this stack's origins, so reusing it verbatim
# would block the local frontend's post-login RSC prefetch. The mechanism is
# unchanged — proxy_hide_header strips the upstream header, because multi-CSP
# semantics are intersection and appending alone cannot widen anything.
#
# Why connect-src has a ${ZITADEL_PORT} placeholder, not a literal port: the
# proxy publishes on ${ZITADEL_PORT:-8080} (docker-compose.yml), and nginx
# conf files do not interpolate environment variables on their own. A
# hardcoded "http://localhost:8080" here would silently mismatch a stack
# brought up with a non-default ZITADEL_PORT (needed on any host where
# something else already holds 127.0.0.1:8080) — the exact class of bug
# Correction 1 fixed for the issuer URLs. Fixed the same way here: this
# file is bind-mounted into the nginx container at
# /etc/nginx/templates/default.conf.template (see the zitadel-proxy service),
# which makes nginx's stock docker-entrypoint.d/20-envsubst-on-templates.sh
# render it through `envsubst` at container start. By default that entrypoint
# substitutes EVERY environment variable present in the container against a
# template whose entire content is nginx variables using that same `$name`
# syntax — harmless today only because no container env var happens to
# collide with `$http_host`, `$zitadel_host`, `$remote_addr`, etc., not
# because the mechanism protects against it. zitadel-proxy's environment:
# block therefore also sets NGINX_ENVSUBST_FILTER: '^ZITADEL_PORT$', which
# the entrypoint script passes straight into an awk regex match against every
# container env var name — restricting substitution to exactly ZITADEL_PORT
# so a later `environment:` addition to zitadel-proxy cannot silently mangle
# this conf. The .conf extension on the host-side filename is unchanged; only
# the container-side mount path carries the .template suffix that triggers
# rendering at all.
#
# Routing:
#   /ui/v2/login*   -> zitadel-login:3000
#   everything else -> zitadel:8080
#
# Host normalization (127.0.0.1 / [::1] -> localhost, port preserved): every
# published port in this stack binds 127.0.0.1 specifically, so a developer
# typing "http://127.0.0.1:${ZITADEL_PORT}/..." is entirely natural — and it
# forwards Host: 127.0.0.1:${ZITADEL_PORT}, which matches no domain registered
# on the instance (ZITADEL_EXTERNALDOMAIN is "localhost"), reproducing the same
# "Instance not found" failure $http_host/CUSTOM_REQUEST_HEADERS were fixed
# for. $http_host preserves whatever Host the client sent; it does not
# normalize it. This is a deliberate normalization, not a workaround that
# masks a misconfiguration: 127.0.0.1 and localhost are the same loopback
# instance by construction (both are literally this stack, nothing else could
# be listening), so treating them as one instance identity is correct, not a
# fix that papers over a real difference. Registering 127.0.0.1 as a second
# instance domain in Zitadel was deliberately rejected — that would be
# provisioned state, not configuration, and would not survive a volume wipe.
#
# The map must sit here, outside server{}: this file lands inside nginx.conf's
# http{} block via `include /etc/nginx/conf.d/*.conf;` (confirmed by reading
# nginx.conf inside the running container), which is the only context `map`
# is valid in.
map $http_host $zitadel_host {
    default                               $http_host;
    "~^127\.0\.0\.1(?<hostport>:\d+)?$"   "localhost$hostport";
    # [::1] is currently unreachable in this stack (every port publish below
    # binds 127.0.0.1 specifically, not [::1] or 0.0.0.0), but kept for
    # defense in depth in case that ever changes.
    "~^\[::1\](?<hostport>:\d+)?$"        "localhost$hostport";
}

upstream zitadel_backend {
    server zitadel:8080;
}

upstream zitadel_login {
    server zitadel-login:3000;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 10m;

    location /ui/v2/login {
        proxy_pass http://zitadel_login;
        proxy_http_version 1.1;
        # $zitadel_host, not $host or bare $http_host: nginx's $host strips
        # the port from the request's Host header by definition, which
        # silently drops the port from what Zitadel uses to derive its
        # issuer (Correction 1's failure mode, reached through the proxy).
        # $http_host preserves the port but doesn't normalize 127.0.0.1/[::1]
        # to localhost (see the map{} block above for why that normalization
        # is needed). $zitadel_host does both: preserves the port, normalizes
        # the host part.
        #
        # X-Forwarded-Host gets the SAME normalized value, not the client's
        # literal Host, deliberately: Zitadel's instance resolution reads the
        # Host header (confirmed empirically — varying only Host, with no
        # X-Forwarded-Host at all, changed which instance/issuer was
        # returned), so Host is what must be normalized for correctness.
        # X-Forwarded-Host is then just informational metadata mirroring it;
        # leaving it as the client's literal value would let X-Forwarded-Host
        # disagree with Host about the instance's identity, and any code that
        # trusts X-Forwarded-Host instead of Host (e.g. zitadel-login building
        # a redirect/link) could reintroduce this exact failure on a second
        # path. One canonical value, both headers.
        proxy_set_header Host $zitadel_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # http, not https: this stack terminates nothing and runs over plain
        # HTTP, matching ZITADEL_EXTERNALSECURE=false.
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $zitadel_host;
        proxy_set_header Connection '';

        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' http://localhost:3000 http://localhost:${ZITADEL_PORT}; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' http://zitadel:8080; frame-ancestors 'none'; object-src 'none'" always;
    }

    location / {
        proxy_pass http://zitadel_backend;
        proxy_http_version 1.1;
        # $zitadel_host, not $host or bare $http_host — see the /ui/v2/login
        # location for why (port preservation + 127.0.0.1/[::1] normalization).
        proxy_set_header Host $zitadel_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $zitadel_host;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
