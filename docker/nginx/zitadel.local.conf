# Local-development copy of cdcf-infra's auth/nginx/zitadel.conf.
#
# ⚠ This is a SECOND COPY of a file whose comments carry real reasoning. The
# routing half must otherwise stay in step with the original at:
#   https://github.com/CatholicOS/cdcf-infra/blob/main/auth/nginx/zitadel.conf
#
# Two deliberate divergences from that original, both explained below: the
# Content-Security-Policy, and $http_host in place of $host on the Host /
# X-Forwarded-Host headers. Production is invisible to the second divergence
# because it runs on a default port (where $host and $http_host agree); this
# stack is not, since ${ZITADEL_PORT} is routinely non-default.
#
# Why the CSP differs: production's connect-src allowlists the CDCF and LitCal
# origins. It does not include this stack's origins, so reusing it verbatim
# would block the local frontend's post-login RSC prefetch. The mechanism is
# unchanged — proxy_hide_header strips the upstream header, because multi-CSP
# semantics are intersection and appending alone cannot widen anything.
#
# Why connect-src has a ${ZITADEL_PORT} placeholder, not a literal port: the
# proxy publishes on ${ZITADEL_PORT:-8080} (docker-compose.yml), and nginx
# conf files do not interpolate environment variables on their own. A
# hardcoded "http://localhost:8080" here would silently mismatch a stack
# brought up with ZITADEL_PORT=8090 (as this machine's .env does, because
# NVIDIA Broadcast holds 127.0.0.1:8080 on the Windows host) — the exact class
# of bug Correction 1 fixed for the issuer URLs. Fixed the same way here: this
# file is bind-mounted into the nginx container at
# /etc/nginx/templates/default.conf.template (see the zitadel-proxy service),
# which makes nginx's stock docker-entrypoint.d/20-envsubst-on-templates.sh
# render it through `envsubst` at container start, substituting only
# variables that are actually present in the container's environment (the
# zitadel-proxy service sets ZITADEL_PORT there) — so nginx's own $http_host,
# $remote_addr, etc. below are left untouched. The .conf extension on the
# host-side filename is unchanged; only the container-side mount path carries
# the .template suffix that triggers this.
#
# Routing:
#   /ui/v2/login*   -> zitadel-login:3000
#   everything else -> zitadel:8080

upstream zitadel_backend {
    server zitadel:8080;
}

upstream zitadel_login {
    server zitadel-login:3000;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 10m;

    location /ui/v2/login {
        proxy_pass http://zitadel_login;
        proxy_http_version 1.1;
        # $http_host, not $host: nginx's $host variable strips the port from
        # the request's Host header by definition. On the default port that's
        # invisible, but on a moved ${ZITADEL_PORT} (e.g. 8090) it silently
        # drops the port from the Host/X-Forwarded-Host Zitadel uses to derive
        # its issuer, producing "http://localhost" instead of
        # "http://localhost:8090" — the exact failure Correction 1 exists to
        # prevent, just reached through the proxy instead of a hardcoded
        # literal. Confirmed empirically: curl sent "Host: localhost:8090",
        # $host still forwarded "localhost" until this was changed to
        # $http_host, which passes the client's Host header through verbatim.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # http, not https: this stack terminates nothing and runs over plain
        # HTTP, matching ZITADEL_EXTERNALSECURE=false.
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection '';

        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' http://localhost:3000 http://localhost:${ZITADEL_PORT}; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' http://zitadel:8080; frame-ancestors 'none'; object-src 'none'" always;
    }

    location / {
        proxy_pass http://zitadel_backend;
        proxy_http_version 1.1;
        # $http_host, not $host — see the /ui/v2/login location for why.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
