# Martyrology full development stack.
#
# Mirrors cdcf-infra production topology: Zitadel and the v2 login UI behind a
# single nginx origin, with image versions pinned to production's. That
# fidelity is the point — this stack exists to verify an OIDC flow that will
# run against cdcf-infra, and redirect URIs, issuer discovery and CSP are
# exactly what a two-origin issuer gets wrong.
#
# Builds from GitHub refs by default so a bare clone stands the whole system up.
# For local sibling checkouts:
#   cp docker-compose.override.example.yml docker-compose.override.yml
#
# Bring-up: see README.md → "Local development stack".
#
# Port 8081 is deliberately unused: login v2 sits behind the proxy at
# :8080/ui/v2/login rather than on its own origin.
#
# ZITADEL_PORT is the ONE externally-advertised port variable in this file.
# Every origin a browser or OIDC client sees — the proxy's published port,
# ZITADEL_EXTERNALPORT, and the three LOGINV2/OIDC URLs below — follows it, so
# moving the published port (e.g. ZITADEL_PORT=8090, needed on machines where
# something else already holds 127.0.0.1:8080) can never leave Zitadel still
# advertising 8080 to itself. Purely container-internal addresses (zitadel:8080,
# zitadel-login:3000, ZITADEL_API_URL, Adminer's internal 8080, and the
# right-hand side of every port mapping) are NOT parameterized — nothing outside
# the docker network ever resolves them, so there is nothing for a moved
# external port to desynchronize from.
#
# PLATFORM: developed and verified on Docker Desktop (WSL2/macOS). The
# martyrology-api and martyrology-frontend services rely on
# `extra_hosts: ["localhost:host-gateway"]` to reach zitadel-proxy from
# inside a container — Zitadel resolves instances by Host header (see
# zitadel-login's CUSTOM_REQUEST_HEADERS comment below), so introspection and
# Auth.js discovery both have to present the browser-facing Host, not the
# docker-network one. Docker Desktop's `host-gateway` resolves to vpnkit's
# gateway, which specially bridges into the HOST'S OWN loopback — the only
# reason a container-side "localhost" reaches zitadel-proxy's
# 127.0.0.1-bound publish at all. On native Linux Docker Engine,
# `host-gateway` instead resolves to the ordinary bridge gateway (e.g.
# 172.17.0.1), and a socket published as `127.0.0.1:<port>:<port>` does not
# accept traffic from that address — every port in this file binds
# 127.0.0.1 specifically (a deliberate security property, not an oversight;
# see each service's ports: block), so this stack as committed will very
# likely 401 on native Linux rather than fail loudly. A native Linux user
# needs to widen the publish the app containers actually reach through
# — at minimum zitadel-proxy's `127.0.0.1:${ZITADEL_PORT:-8080}:80` — to
# `0.0.0.0:${ZITADEL_PORT:-8080}:80` (or bind explicitly to the bridge
# gateway address) so traffic arriving from the bridge IP is accepted; that
# is a real, deliberate loosening of this stack's default posture and should
# be made locally (e.g. in docker-compose.override.yml), not upstreamed
# here. Confirmed empirically only on Docker Desktop — see
# .superpowers/sdd/2026-08-04-local-development-stack/task-11-report.md.

name: martyrology

services:
  # Extracts init-db.sql from the API image, so the database bootstrap has one
  # source of truth and no copy is maintained in this repo.
  db-init:
    image: martyrology-api:latest
    build: https://github.com/CatholicOS/martyrology-api.git#main
    entrypoint: ["cp", "/app/scripts/init-db.sql", "/init/01-init.sql"]
    volumes:
      - db_init_scripts:/init
    restart: "no"

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      PGUSER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 30s
      retries: 5
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw
      - db_init_scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - martyrology
    depends_on:
      db-init:
        condition: service_completed_successfully

  # Publishes NOTHING. zitadel-proxy owns the :8080 origin.
  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.15.0
    restart: unless-stopped
    command: 'start-from-init --masterkey "${ZITADEL_MASTERKEY:-MasterkeyNeedsToHave32Characters}"'
    environment:
      ZITADEL_EXTERNALDOMAIN: localhost
      # Describes the PROXY's published port, which is the origin browsers and
      # OIDC clients see. Follows ZITADEL_PORT so moving the published port
      # can never leave Zitadel advertising a stale one.
      ZITADEL_EXTERNALPORT: ${ZITADEL_PORT:-8080}
      ZITADEL_EXTERNALSECURE: false
      ZITADEL_TLS_ENABLED: false

      ZITADEL_DATABASE_POSTGRES_HOST: db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable

      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel-data/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Login V2 Client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: '2030-01-01T00:00:00Z'

      # Single origin: the login UI lives under the proxy, not on its own port.
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: true
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://localhost:${ZITADEL_PORT:-8080}/ui/v2/login
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://localhost:${ZITADEL_PORT:-8080}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://localhost:${ZITADEL_PORT:-8080}/ui/v2/login/logout?post_logout_redirect=

      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel-data/automation-user.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: automation-user
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Automation User
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: '2030-01-01T00:00:00Z'

      ZITADEL_FIRSTINSTANCE_ORG_NAME: "Martyrology"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: root
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: RootPassword1!
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: false

      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_HOST: mailpit:1025
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_USER: ""
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_PASSWORD: ""
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_TLS: false
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROM: noreply@martyrology.localhost
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROMNAME: Martyrology

      ZITADEL_LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 60s
      retries: 5
      start_period: 10s
    user: "0"
    volumes:
      - ./.zitadel-data:/zitadel-data:delegated
    networks:
      - martyrology
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.15.0
    restart: unless-stopped
    environment:
      # Reaches the backend over the docker network, not through the proxy.
      ZITADEL_API_URL: http://zitadel:8080
      # Zitadel resolves which instance a request belongs to from the Host
      # header (multi-instance routing), matched against the instance's
      # registered domains — never from the network path. ZITADEL_API_URL's
      # own host ("zitadel:8080") is not a registered domain, so backend calls
      # without this header fail with "Instance not found" even though the
      # connection itself succeeds. Confirmed empirically (see task-10-report):
      # Host: zitadel:8080 -> 404 Instance not found; Host: localhost:8090 AND
      # bare Host: localhost both resolve, but return DIFFERENT issuers
      # ("http://localhost:8090" vs "http://localhost") — the same class of
      # mismatch $http_host fixes in the nginx conf. Set to the port-qualified
      # form so it agrees with the real browser-facing origin the proxy
      # forwards (Correction 1's ${ZITADEL_PORT:-8080}, never hardcoded).
      CUSTOM_REQUEST_HEADERS: 'Host:localhost:${ZITADEL_PORT:-8080}'
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel-data/login-client.pat
      EMAIL_VERIFICATION: true
    user: "0"
    volumes:
      - ./.zitadel-data:/zitadel-data:ro
    networks:
      - martyrology
    depends_on:
      zitadel:
        condition: service_healthy
        restart: false

  zitadel-proxy:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      # Consumed by nginx's stock docker-entrypoint.d/20-envsubst-on-templates.sh
      # to render the CSP's connect-src for this stack's actual origin — see
      # docker/nginx/zitadel.local.conf for the full explanation.
      ZITADEL_PORT: ${ZITADEL_PORT:-8080}
      # Restricts envsubst-on-templates to substituting ONLY this variable.
      # Unset, the entrypoint substitutes every container env var against the
      # template — harmless today (nothing here collides with nginx's own
      # $variables) but not by design, so a future addition to this block
      # could silently mangle the rendered conf without this filter.
      NGINX_ENVSUBST_FILTER: '^ZITADEL_PORT$'
    volumes:
      # Mounted with a .template suffix on the CONTAINER side (the host
      # filename stays zitadel.local.conf) so nginx's entrypoint renders it
      # through envsubst before nginx starts.
      - ./docker/nginx/zitadel.local.conf:/etc/nginx/templates/default.conf.template:ro
    # Requests the "/" route (proxy_pass http://zitadel_backend in
    # zitadel.local.conf) with the same Host normalization the CSP comment
    # above and CUSTOM_REQUEST_HEADERS already rely on. This deliberately
    # exercises the FORWARDED path rather than nginx's own listening socket:
    # nginx answers on :80 whether or not zitadel is reachable, so a bare TCP
    # or "curl localhost:80" check would report healthy even with a dead
    # upstream (502) and never catch the startup race martyrology-api and
    # martyrology-frontend now depend on this healthcheck to rule out — every
    # Zitadel interaction they make (OIDC discovery, introspection, token
    # exchange) routes through this proxy. A 200 here can only come from
    # zitadel itself answering behind the proxy. $ZITADEL_PORT is the
    # container env var set above, already substituted by compose from
    # ${ZITADEL_PORT:-8080} — read directly, not re-derived.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H \"Host: localhost:$$ZITADEL_PORT\" http://localhost/.well-known/openid-configuration -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "127.0.0.1:${ZITADEL_PORT:-8080}:80"
    networks:
      - martyrology
    depends_on:
      - zitadel
      - zitadel-login

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks:
      - martyrology

  openfga-migrate:
    image: openfga/openfga:v1.15.1
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga_secure_password@db:5432/openfga?sslmode=disable
    networks:
      - martyrology
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  openfga:
    image: openfga/openfga:v1.15.1
    command: run
    restart: unless-stopped
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga_secure_password@db:5432/openfga?sslmode=disable
      # Required — see the API repo's compose for why a tokenless OpenFGA
      # silently disables authorization.
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: "${OPENFGA_PRESHARED_KEY:-local-dev-preshared-key}"
      # No OPENFGA_PLAYGROUND_ENABLED / port 3001 here: OpenFGA v1.15.1 panics
      # at startup ("the playground only supports authn method 'none'") when
      # the Playground is enabled alongside preshared auth. Preshared auth is
      # required (see above), so the Playground cannot be offered in this
      # stack — confirmed empirically, not assumed. Inspect the store with
      # curl instead.
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:8081"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:${OPENFGA_HTTP_PORT:-8083}:8080"
      - "127.0.0.1:${OPENFGA_GRPC_PORT:-8084}:8081"
    networks:
      - martyrology
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully

  authz-seed:
    image: alpine:3.21
    restart: "no"
    environment:
      CDCF_INFRA_REF: "${CDCF_INFRA_REF:-main}"
      OPENFGA_PRESHARED_KEY: "${OPENFGA_PRESHARED_KEY:-local-dev-preshared-key}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        apk add --no-cache bash curl jq git >/dev/null
        rm -rf /tmp/cdcf-infra
        git clone --depth 1 --branch "$$CDCF_INFRA_REF" \
          https://github.com/CatholicOS/cdcf-infra.git /tmp/cdcf-infra
        cd /tmp/cdcf-infra/auth
        cat > .env.local <<EOF
        OPENFGA_API_URL=http://openfga:8080
        OPENFGA_INTERNAL_URL=http://openfga:8080
        OPENFGA_PRESHARED_KEY=$$OPENFGA_PRESHARED_KEY
        EOF
        ./setup-openfga.sh --target local --create-martyrology-store
    networks:
      - martyrology
    depends_on:
      openfga:
        condition: service_healthy

  api-migrate:
    image: martyrology-api:latest
    command: ["alembic", "upgrade", "head"]
    environment:
      MARTYROLOGY_DATABASE_URL: postgresql+psycopg://martyrology:martyrology_secure_password@db:5432/martyrology
    networks:
      - martyrology
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  martyrology-api:
    image: martyrology-api:latest
    build: https://github.com/CatholicOS/martyrology-api.git#main
    restart: unless-stopped
    # Zitadel resolves which instance a request belongs to from the Host
    # header (multi-instance routing), not the network path. A request to
    # http://zitadel:8080 presents Host: zitadel:8080 — not a registered
    # domain — and fails instance resolution with "Instance not found",
    # confirmed empirically against this stack (see task-11-report.md).
    # `martyrology_api.auth.Authenticator` builds the introspection request
    # itself with httpx and has no Host-header override, so the fix has to
    # be a URL that presents an already-registered Host: send the request to
    # the host's loopback instead, which zitadel-proxy forwards under
    # Host: localhost:${ZITADEL_PORT} — the same origin the browser uses.
    # Mirrors LiturgicalCalendarFrontend's pattern for its own containers.
    # Costs a container->host->proxy hop; acceptable for a dev stack.
    #
    # PLATFORM-SPECIFIC — verified on Docker Desktop (WSL2/macOS) only.
    # `host-gateway` here resolves to Docker Desktop's vpnkit gateway, which
    # specially bridges into the HOST'S OWN loopback — that bridging is why a
    # container-side request to "localhost" reaches zitadel-proxy's
    # 127.0.0.1-bound publish at all. On native Linux Docker Engine,
    # `host-gateway` instead resolves to the ordinary bridge gateway (e.g.
    # 172.17.0.1), which is NOT the host's loopback — a socket published as
    # `127.0.0.1:${ZITADEL_PORT}:80` (see zitadel-proxy below) does not
    # accept traffic arriving from the bridge IP, so this would silently
    # break introspection (401s, not an obvious connection error) on native
    # Linux. See the compose file header and .env.example for what a native
    # Linux user needs to change. Confirmed empirically — see
    # task-11-report.md.
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      MARTYROLOGY_ZITADEL_ISSUER: http://localhost:${ZITADEL_PORT:-8080}
      # The issuer above is the browser-facing origin and is what the `iss`
      # claim carries. Transport only — it never affects auth_enabled.
      MARTYROLOGY_ZITADEL_INTERNAL_URL: http://localhost:${ZITADEL_PORT:-8080}
      MARTYROLOGY_ZITADEL_CLIENT_ID: ${MARTYROLOGY_ZITADEL_CLIENT_ID:-}
      MARTYROLOGY_ZITADEL_CLIENT_SECRET: ${MARTYROLOGY_ZITADEL_CLIENT_SECRET:-}
      MARTYROLOGY_ZITADEL_PROJECT_ID: ${MARTYROLOGY_ZITADEL_PROJECT_ID:-}
      MARTYROLOGY_OPENFGA_API_URL: http://openfga:8080
      MARTYROLOGY_OPENFGA_STORE_ID: ${MARTYROLOGY_OPENFGA_STORE_ID:-}
      MARTYROLOGY_OPENFGA_MODEL_ID: ${MARTYROLOGY_OPENFGA_MODEL_ID:-}
      MARTYROLOGY_OPENFGA_API_TOKEN: ${OPENFGA_PRESHARED_KEY:-local-dev-preshared-key}
      MARTYROLOGY_DATABASE_URL: postgresql+psycopg://martyrology:martyrology_secure_password@db:5432/martyrology
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    networks:
      - martyrology
    depends_on:
      zitadel:
        condition: service_healthy
      # Introspection is sent to the proxy (MARTYROLOGY_ZITADEL_INTERNAL_URL
      # above), not to zitadel directly — gating on zitadel alone leaves a
      # startup race where the proxy hasn't started forwarding yet.
      zitadel-proxy:
        condition: service_healthy
      openfga:
        condition: service_healthy
      authz-seed:
        condition: service_completed_successfully
      api-migrate:
        condition: service_completed_successfully

  martyrology-frontend:
    image: martyrology-frontend:latest
    build: https://github.com/CatholicOS/martyrology-frontend.git#main
    restart: unless-stopped
    # Auth.js must reach the issuer server-side (discovery, token exchange) at
    # the SAME origin the browser is redirected to, so `localhost` has to mean
    # the host here rather than this container's loopback. Same pattern as
    # LiturgicalCalendarFrontend's litcal-frontend service.
    #
    # PLATFORM-SPECIFIC — same caveat as martyrology-api's extra_hosts above:
    # `host-gateway` only reaches zitadel-proxy's 127.0.0.1-bound publish
    # because Docker Desktop's vpnkit gateway specially bridges into the
    # host's own loopback. Native Linux Docker Engine's plain bridge gateway
    # does not, so this needs adjustment there (see compose file header).
    # NOT independently verified end-to-end here — no live login redirect was
    # exercised in this task; verified only by analogy to the API's proven
    # fix (task-11-report.md).
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      # Server-side proxy calls route over the docker network.
      API_BASE: http://martyrology-api:8000
      AUTH_URL: http://localhost:${FRONTEND_PORT:-3000}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_ZITADEL_ID: ${AUTH_ZITADEL_ID:-}
      AUTH_ZITADEL_SECRET: ${AUTH_ZITADEL_SECRET:-}
      AUTH_ZITADEL_ISSUER: http://localhost:${ZITADEL_PORT:-8080}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      - martyrology
    depends_on:
      martyrology-api:
        condition: service_healthy
      # Auth.js discovery/token exchange also goes through the proxy
      # (AUTH_ZITADEL_ISSUER above) — same startup-race reasoning as
      # martyrology-api's zitadel-proxy dependency.
      zitadel-proxy:
        condition: service_healthy

  adminer:
    image: adminer:latest
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: lucas-sandery
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8088}:8080"
    networks:
      - martyrology
    depends_on:
      - db

networks:
  martyrology:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  db_init_scripts:
    driver: local
